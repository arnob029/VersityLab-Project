<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Task Management System</title>
    <meta name="description" content="Create a new Task Management System account">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">📋</div>
            <div class="logo-text">TaskFlow</div>
        </div>
        <h2>Create Account</h2>
        <p class="subtitle">Join your team's workspace today</p>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="e.g. Rahim Ahmed" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                <span id="btnText">Create Account</span>
                <span id="btnSpinner" class="spinner" style="display:none;"></span>
            </button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="index.html">Sign In</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
