<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Task Management System</title>
    <meta name="description" content="Login to your Task Management System account">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">📋</div>
            <div class="logo-text">TaskFlow</div>
        </div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                <span id="btnText">Sign In</span>
                <span id="btnSpinner" class="spinner" style="display:none;"></span>
            </button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="register.html">Create Account</a>
        </div>
        <div style="text-align:center; margin-top:20px; font-size:10px; color:var(--text-muted);">
            v1.2.3
        </div>
    </div>

    <script src="js/auth.js?v=1.2.3"></script>
</body>
</html>
